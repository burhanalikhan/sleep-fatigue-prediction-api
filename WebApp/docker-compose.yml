services:

  api:
    build: .
    container_name: sleep-fatigue-api
    expose:
      - "5000"

  nginx:
    image: nginx:alpine
    container_name: sleep-fatigue-nginx

    ports:
      - "80:80"
      - "443:443"

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro

    depends_on:
      - api